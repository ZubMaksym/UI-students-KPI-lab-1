<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Лабораторні роботи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fff6e5;
        --panel: #ffffff;
        --ink: #2b2233;
        --muted: #75687a;
        --sans: "Poppins", "Montserrat", "Segoe UI", Roboto, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #15172a;
          --panel: #1f2238;
          --ink: #eef0ff;
          --muted: #a5a8c8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.5;
      }
      :focus-visible {
        outline: 3px solid #3a86ff;
        outline-offset: 2px;
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 56px 20px 48px;
      }
      h1 {
        font-size: clamp(32px, 6vw, 50px);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      h1 .dot {
        display: inline-block;
        width: 0.32em;
        height: 0.32em;
        border-radius: 50%;
        margin-left: 0.08em;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 30px;
        font-size: 17px;
      }
      .labs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }
      .labs a {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        background: var(--panel);
        border-radius: 16px;
        border-left: 8px solid var(--c);
        text-decoration: none;
        color: var(--ink);
        box-shadow: 0 6px 18px -10px var(--c);
      }
      .labs a:hover {
        transform: translateY(-2px);
      }
      .n {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--c);
        color: #fff;
        font-weight: 800;
        display: grid;
        place-items: center;
        font-size: 17px;
      }
      .t {
        font-weight: 800;
        font-size: 19px;
        display: block;
      }
      .d {
        color: var(--muted);
        font-size: 15px;
      }
      footer {
        margin-top: 36px;
        color: var(--muted);
        font-size: 14px;
      }
      @media (prefers-reduced-motion: reduce) {
        .labs a:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>
        Лабораторні роботи<span class="dot" style="background: #ff5d73"></span
        ><span class="dot" style="background: #ffb703"></span
        ><span class="dot" style="background: #3a86ff"></span>
      </h1>
      <p class="lead">Зуб М.Є., ІП-44</p>
      <ul class="labs">
        <li>
          <a href="lab2/" style="--c: #3a86ff">
            <span class="n">2</span>
            <span
              ><span class="t">UI-елементи веб-сторінки</span
              ><span class="d">10 базових елементів інтерфейсу</span></span
            >
          </a>
        </li>
      </ul>
      <footer>Київ, 2026</footer>
    </div>
  </body>
</html>
